<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | 속초 베케이션 호텔</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api/supabase.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            padding-top: 80px;
            background-color: #f8f9fa;
        }

        .auth-card {
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-header h2 {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #555;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-family: 'Pretendard', sans-serif;
        }

        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: var(--primary-color, #1a2b3c);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-auth:hover {
            background: #2c3e50;
        }

        .auth-links {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: #666;
        }

        .auth-links a {
            color: var(--primary-color, #1a2b3c);
            text-decoration: underline;
        }

        .error-message {
            color: #dc3545;
            text-align: center;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        @media (max-width: 480px) {
            .auth-container {
                padding: 1rem;
                padding-top: 60px;
                /* Reduced top padding */
            }

            .auth-card {
                padding: 1.5rem;
                /* Reduced internal padding */
            }

            .auth-header h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <header id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">SOKCHO VACATION</span>
                <span class="logo-sub">HOTEL</span>
            </a>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>회원가입</h2>
                <p>멤버십 혜택을 누려보세요</p>
            </div>

            <div id="error-msg" class="error-message"></div>

            <form id="signup-form">
                <div class="form-group">
                    <label for="name">이름</label>
                    <input type="text" id="name" required placeholder="홍길동">
                </div>
                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" required placeholder="example@email.com">
                </div>
                <div class="form-group">
                    <label for="password">비밀번호</label>
                    <input type="password" id="password" required placeholder="6자 이상 입력하세요">
                </div>
                <button type="submit" class="btn-auth">가입하기</button>
            </form>

            <div class="auth-links">
                이미 계정이 있으신가요? <a href="login.html">로그인</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');

            errorMsg.style.display = 'none';

            if (password.length < 6) {
                errorMsg.innerText = '비밀번호는 6자 이상이어야 합니다.';
                errorMsg.style.display = 'block';
                return;
            }

            if (!supabase) {
                errorMsg.innerText = '시스템 오류: 서버 연결 실패';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const { data, error } = await signUp(email, password, name);

                if (error) {
                    throw error;
                }

                if (data.user) {
                    if (data.session === null) {
                        alert('회원가입 확인 메일이 발송되었습니다.\n(이미 가입된 이메일이라면 메일이 발송되지 않습니다.)\n\n이메일함에서 인증 링크를 클릭하신 후 로그인해주세요.');
                    } else {
                        alert('회원가입이 완료되었습니다!\n로그인 페이지로 이동합니다.');
                    }
                    window.location.href = 'login.html';
                }
            } catch (err) {
                errorMsg.innerText = '가입 실패: ' + err.message;
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>

</html>
