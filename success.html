<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>예약 완료 | 속초 베케이션 호텔</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">

    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api/supabase.js"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        .success-container {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            padding-top: 80px;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: #e6f4ea;
            color: #1e8e3e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 1.5rem;
        }

        .order-info {
            background: #f8f9fa;
            padding: 2rem;
            border-radius: 8px;
            margin: 2rem 0;
            text-align: left;
            width: 100%;
            max-width: 500px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px dashed #ddd;
        }

        .info-row:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        .info-label {
            color: #666;
        }

        .info-value {
            font-weight: 600;
            color: #333;
        }

        .loading {
            color: #666;
        }
    </style>
</head>

<body>
    <header id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">SOKCHO VACATION</span>
                <span class="logo-sub">HOTEL</span>
            </a>
        </div>
    </header>

    <div class="success-container">
        <div id="loading" class="loading">
            <h2>결제 확인 중입니다...</h2>
            <p>잠시만 기다려주세요.</p>
        </div>

        <div id="success-content" style="display: none;">
            <div class="success-icon">✓</div>
            <h2>예약이 확정되었습니다!</h2>
            <p>속초 베케이션 호텔을 선택해주셔서 감사합니다.</p>

            <div class="order-info">
                <div class="info-row">
                    <span class="info-label">주문 번호</span>
                    <span class="info-value" id="order-id"></span>
                </div>
                <div class="info-row">
                    <span class="info-label">결제 금액</span>
                    <span class="info-value" id="amount"></span>
                </div>
            </div>

            <a href="index.html" class="btn btn-primary">홈으로 돌아가기</a>
        </div>

        <div id="error-content" style="display: none;">
            <h2 style="color: #dc3545;">예약 처리 중 오류가 발생했습니다.</h2>
            <p id="error-msg"></p>
            <a href="index.html" class="btn btn-secondary">홈으로 돌아가기</a>
        </div>
    </div>

    <script>
        // URL 파라미터 파싱
        const urlParams = new URLSearchParams(window.location.search);
        
        // 포트원 파라미터 (PC 결제 완료 후, 또는 모바일 리다이렉트 후)
        const impUid = urlParams.get('imp_uid');
        const merchantUid = urlParams.get('merchant_uid');
        const impSuccess = urlParams.get('imp_success'); // 모바일 환경에서 성공여부
        
        // 예약 정보 파라미터 (booking.html 에서 넘겨준 값들)
        const roomId = urlParams.get('room_id');
        const checkIn = urlParams.get('check_in');
        const checkOut = urlParams.get('check_out');
        const guests = urlParams.get('guests');
        const userId = urlParams.get('user_id');
        const amount = urlParams.get('amount') || urlParams.get('paid_amount'); // PC에서는 직접 넘기거나, 모바일에서는 확인 필요할 수 있음

        async function processBooking() {
            // 모바일 환경 결제 실패 처리
            if (impSuccess === 'false') {
                const errorMsg = urlParams.get('error_msg') || '결제 혹은 취소되었습니다.';
                showError('결제 실패: ' + errorMsg);
                return;
            }

            // 필수 파라미터 검증 (impUid 또는 merchantUid가 있어야 함)
            if ((!impUid && !merchantUid) || !roomId || !checkIn || !checkOut) {
                showError('결제 정보 또는 예약 정보가 유효하지 않습니다.');
                return;
            }

            // 1. DB에 예약 정보 저장
            // (실제로는 서버에서 결제 승인 API 호출 후 저장해야 함)

            try {
                // api/supabase.js의 createBooking 함수 사용
                const bookingData = {
                    user_id: userId,
                    room_id: parseInt(roomId), // Ensure integer
                    check_in: checkIn,
                    check_out: checkOut,
                    guests: parseInt(guests),
                    total_price: parseInt(amount),
                    status: 'confirmed',
                    // payment_key: paymentKey, // Optional: Save payment key if DB has column
                    // order_id: orderId
                };

                const { data, error } = await createBooking(bookingData);

                if (error) throw error;

                // 성공 화면 표시
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success-content').style.display = 'block';
                document.getElementById('order-id').innerText = merchantUid || impUid || '알 수 없음';
                document.getElementById('amount').innerText = parseInt(amount).toLocaleString() + '원';

            } catch (err) {
                console.error(err);
                showError('예약 정보 저장 실패: ' + err.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error-content').style.display = 'block';
            document.getElementById('error-msg').innerText = msg;
        }

        // 실행
        processBooking();
    </script>
</body>

</html>
