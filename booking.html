<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 예약 | 속초 베케이션 호텔</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Supabase SDK & Toss Payments -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api/supabase.js"></script>
    <script src="https://js.tosspayments.com/v1/payment"></script>

    <link rel="stylesheet" href="style.css">
    <style>
        /* 예약 페이지 전용 스타일 */
        .booking-header {
            background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('images/hero-bg.jpg');
            /* 메인 배경 재사용 */
            background-size: cover;
            background-position: center;
            height: 40vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            margin-bottom: 3rem;
        }

        .booking-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .filter-section {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            display: flex;
            gap: 1.5rem;
            align-items: flex-end;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }


        .filter-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #333;
        }

        .filter-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        .btn-check {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }

        .room-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 2rem;
        }

        .empty-state {
            text-align: center;
            padding: 4rem;
            background: #f8f9fa;
            border-radius: 12px;
            grid-column: 1 / -1;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: white;
            width: 100%;
            max-width: 1000px;
            max-height: 90vh;
            border-radius: 12px;
            overflow-y: auto;
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: rgba(255, 255, 255, 0.8);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .modal-body {
            display: flex;
            flex-wrap: wrap;
        }

        .modal-gallery {
            flex: 1.2;
            min-width: 300px;
            background: #f0f0f0;
        }

        .main-image-frame {
            width: 100%;
            height: 400px;
            overflow: hidden;
        }

        .main-image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sub-images {
            display: flex;
            gap: 10px;
            padding: 10px;
            overflow-x: auto;
        }

        .sub-images img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            cursor: pointer;
            border-radius: 4px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .sub-images img:hover,
        .sub-images img.active {
            opacity: 1;
            border: 2px solid var(--primary-color);
        }

        .modal-info {
            flex: 1;
            min-width: 300px;
            padding: 2rem;
        }

        .modal-info h2 {
            font-family: 'Noto Serif KR', serif;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .modal-description {
            color: #555;
            line-height: 1.6;
            margin: 1.5rem 0;
            max-height: 150px;
            overflow-y: auto;
        }

        .modal-tags {
            margin-bottom: 1rem;
        }

        .modal-price-area {
            background: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .modal-price-area .price {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 1rem;
        }

        .amenity-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
            color: #666;
            font-size: 0.9rem;
        }

        .amenity-grid span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        @media (max-width: 768px) {
            .modal-body {
                flex-direction: column;
            }

            .main-image-frame {
                height: 250px;
            }
        }
    </style>
    <script>
        // Debug Helper - Defined early in HEAD
        function debugLog(msg) {
            const consoleDiv = document.getElementById('debug-console');
            if (consoleDiv) {
                consoleDiv.style.display = 'block';
                consoleDiv.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${msg}</div>`;
            }
            console.log(msg);
        }

        function debugError(msg) {
            const consoleDiv = document.getElementById('debug-console');
            if (consoleDiv) {
                consoleDiv.style.display = 'block';
                consoleDiv.innerHTML += `<div style="color:red; font-weight:bold;">[ERROR] ${msg}</div>`;
            }
            console.error(msg);
        }

        // Immediate check
        window.addEventListener('error', function (e) {
            // debugError('Global Syntax/Runtime Error: ' + e.message);
            // alert('Global Error: ' + e.message);
        });
    </script>
</head>

<body>
    <header id="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <span class="logo-text">SOKCHO VACATION</span>
                <span class="logo-sub">HOTEL</span>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html#about">호텔 소개</a></li>
                    <li><a href="index.html#rooms">객실</a></li>
                    <li><a href="index.html#info">이용 안내</a></li>
                    <li class="auth-item"><a href="login.html">로그인</a></li>

    <div class="booking-header">

    <main class="booking-container">
        <!-- Debug Console (Temporary) -->
        <div id="debug-console"
            style="background:#333; color:#0f0; padding:10px; margin-bottom:20px; font-family:monospace; display:none;">
            <strong>Debug Log:</strong><br>
        </div>
        <!-- 날짜 선택 섹션 -->

    <!-- Room Detail Modal -->
    <div id="room-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
            <div class="modal-body">
                <div class="modal-gallery">
                    <div class="main-image-frame">
                        <img id="modal-main-img" src="" alt="Room Main Image">
                    </div>
                    <div class="sub-images" id="modal-sub-images">

                    </div>

                    <div class="room-tags" id="modal-tags">
                        <!-- Tags injected here -->
                    </div>

                        <div class="amenity-grid">
                            <span><i data-lucide="wifi"></i> WiFi</span>
                            <span><i data-lucide="tv"></i> TV</span>
                            <span><i data-lucide="wind"></i> 에어컨</span>
                            <span><i data-lucide="coffee"></i> 커피포트</span>
                            <span><i data-lucide="droplet"></i> 욕실용품</span>

                        </div>

    <script src="app.js"></script>
    <script>
        // Initialize Lucide icons safely on load
        if (window.lucide) {
            try { lucide.createIcons(); } catch (e) { console.warn(e); }
        }

        // IMPROVED DEBUGGING: Alert to confirm script execution
        // alert('System Check: Script Loaded. Starting Supabase check...');

        // Initial Check
        debugLog('Script initializing...');
        if (typeof supabase === 'undefined') {
            debugError('Supabase is undefined immediately!');
            // alert('Critical: Supabase SDK missing');
        } else {
            debugLog('Supabase SDK found.');
        }

        // URL 파라미터 또는 기본값으로 날짜 설정
        const urlParams = new URLSearchParams(window.location.search);
        const paramCheckin = urlParams.get('checkin');
        const paramCheckout = urlParams.get('checkout');
        const paramGuests = urlParams.get('guests');

        const today = new Date().toISOString().split('T')[0];
        const tomorrow = new Date(new Date().setDate(new Date().getDate() + 1)).toISOString().split('T')[0];

        document.getElementById('checkin').value = paramCheckin || today;
        document.getElementById('checkout').value = paramCheckout || tomorrow;
        if (paramGuests) document.getElementById('guests').value = paramGuests;

        // 추가 이미지 관리 (하드코딩)
        const roomExtraImages = {
            '스탠다드 더블': ['images/room-double.jpg', 'images/room-double-bath.jpg'],
            '스탠다드 트윈': ['images/room-twin.jpg', 'images/room-double-bath.jpg', 'images/room-twin-view.jpg'],
            '다이닝 룸': ['images/room-dining.jpg', 'images/room-dining-bath.jpg', 'images/room-dining-dishware.jpg'],
            '무비 다이닝': ['images/room-movie-dining.jpg', 'images/room-movie-dining-view.jpg', 'images/room-movie-dining-bed.jpg', 'images/room-movie-dining-kitchen.jpg'],
            '무비': ['images/room-movie.jpg', 'images/room-movie-view.jpg', 'images/room-movie-dining-bed.jpg', 'images/room-movie-dining-kitchen.jpg'],
            '플레이': ['images/room-play.jpg', 'images/room-play-view.jpg', 'images/room-movie-dining-bed.jpg', 'images/room-movie-dining-kitchen.jpg'],
            '키즈': ['images/room-kids-bed.jpg', 'images/room-kids-view.jpg', 'images/room-kids-bath.jpg'],
            '비즈니스': ['images/room-business.jpg', 'images/room-business-view.jpg', 'images/room-business-relax.jpg', 'images/room-business-kitchen.jpg'],
            '웰니스': ['images/room-wellness.jpg', 'images/room-wellness-view.jpg', 'images/room-wellness-bed.jpg', 'images/room-wellness-kitchen.jpg'],
            // 기본값
            'default': []
        };

        // 전역 객실 데이터 저장소
        let allRoomsData = [];

        // 객실 목록 불러오기
        async function loadRooms() {
            const roomList = document.getElementById('room-list');
            // debugLog('loadRooms started.');

            if (typeof supabase === 'undefined' || !supabase) {
                debugError('Supabase SDK is missing or not initialized.');
                roomList.innerHTML = '<div class="empty-state"><p style="color:red">데이터베이스 연결 오류</p><p>Supabase SDK가 로드되지 않았습니다.</p></div>';
                return;
            }

            try {
                // debugLog('Fetching rooms from Supabase...');
                // DB에서 객실 정보 조회
                const { data: rooms, error } = await supabase.from('rooms').select('*').order('price');

                if (error) {
                    throw error;
                }

                if (!rooms || rooms.length === 0) {
                    debugLog('No rooms found in database.');
                    roomList.innerHTML = '<div class="empty-state"><p>등록된 객실이 없습니다.</p><p>관리자에게 문의해주세요. (DB 데이터 없음)</p></div>';
                    return;
                }

                // debugLog(`Fetched ${rooms.length} rooms.`);
                // 전역 변수에 저장
                allRoomsData = rooms;

                // 객실 렌더링
                // Using Event Delegation: Added data-id attribute
                roomList.innerHTML = rooms.map(room => `
                    <div class="room-card-grid fade-in-up" data-id="${room.id}" style="cursor: pointer;">
                        <div class="room-thumb" 
                             style="background-image: url('${room.image_url || 'images/default-room.jpg'}');">
                        </div>
                        <div class="room-details">
                            <h3>${room.name}</h3>
                            <p>${room.description || '편안한 휴식을 위한 객실입니다.'}</p>
                            <div class="room-tags">
                                <span class="tag">기준 ${room.base_occupancy}인</span>
                                <span class="tag">최대 ${room.max_occupancy}인</span>
                            </div>
                            <div class="room-price">
                                ￦${room.price.toLocaleString()} / 1박
                            </div>
                            <button class="btn-reserve" style="width:100%; margin-top:1rem;">상세보기 및 예약</button>
                        </div>
                    </div>
                `).join('');

                // debugLog('Rooms rendered successfully.');
                // 애니메이션이 적용되지 않을 경우를 대비해 강제로 표시 (CSS 이슈 방지)
                setTimeout(() => {
                    const cards = document.querySelectorAll('.room-card-grid');
                    cards.forEach(card => card.style.opacity = '1');
                }, 100);

            } catch (err) {
                debugError('Error in loadRooms: ' + (err.message || JSON.stringify(err)));
                roomList.innerHTML = `<div class="empty-state">
                    <p style="color:red; font-weight:bold;">객실 정보를 불러올 수 없습니다.</p>
                    <p style="color:#666;">${err.message || '알 수 없는 오류가 발생했습니다.'}</p>
                    <div style="margin-top:1rem; padding:1rem; background:#eee; font-size:0.8rem; text-align:left; border-radius:4px;">
                        <strong>Error Details:</strong><br>
                        ${JSON.stringify(err, null, 2)}
                    </div>
                </div>`;
            }
        }

        // --- Modal Logic ---

        function openRoomDetail(roomId) {
            debugLog('openRoomDetail called with ID: ' + roomId);
            // ID로 객실 데이터 찾기
            const room = allRoomsData.find(r => r.id == roomId); // loose equality for string/number match

            if (!room) {
                console.error('Room not found:', roomId);
                return;
            }

            const modal = document.getElementById('room-modal');
            const mainImg = document.getElementById('modal-main-img');
            const subImagesDiv = document.getElementById('modal-sub-images');

            // Text Content
            document.getElementById('modal-title').textContent = room.name;
            document.getElementById('modal-desc').textContent = room.description || '편안한 휴식을 위한 객실입니다.';
            document.getElementById('modal-price').textContent = `￦${room.price.toLocaleString()} / 1박`;

            // Tags
            const tagsDiv = document.getElementById('modal-tags');
            tagsDiv.innerHTML = `
                <span class="tag">기준 ${room.base_occupancy}인</span>
                <span class="tag">최대 ${room.max_occupancy}인</span>
            `;

            // Images
            const mainImgSrc = room.image_url || 'images/default-room.jpg';
            // Start with main image
            mainImg.src = mainImgSrc;

            // Extra Images Logic
            // If room name is in our extra list, use those. Otherwise just the main one.
            // Also include the main image in the list if it's not already there?
            // Let's just use the explicit list from roomExtraImages if available, prepending the main image if it's not in there.

            let allImages = [];
            if (roomExtraImages[room.name]) {
                // Use defined images (make sure main image is first if desired, or just use the list)
                // If the list in roomExtraImages includes the main image, great. If not, we might want to add it.
                // In my config: '스탠다드 더블': ['images/room-double.jpg', 'images/room-double-bath.jpg']
                // room.image_url is likely 'images/room-double.jpg'.
                allImages = roomExtraImages[room.name];
            } else {
                allImages = [mainImgSrc];
            }

            // Render sub images
            subImagesDiv.innerHTML = allImages.map((src, index) => `
                <img src="${src}" onclick="changeMainImage(this.src)" class="${src === mainImgSrc ? 'active' : ''}">
            `).join('');

            // Book Button Logic
            const bookBtn = document.getElementById('modal-book-btn');
            // Remove old event listeners by cloning or just setting onclick
            bookBtn.onclick = () => bookRoom(room.id, room.name, room.price);

            // Show Modal
            modal.classList.add('active');
            document.body.style.overflow = 'hidden'; // Prevent background scrolling

            if (window.lucide) {
                try { lucide.createIcons(); } catch (e) { console.warn(e); }
            }
        }

        function closeModal() {
            document.getElementById('room-modal').classList.remove('active');
            document.body.style.overflow = '';
        }

        function changeMainImage(src) {
            document.getElementById('modal-main-img').src = src;
            // Highlight active thumb
            const thumbs = document.querySelectorAll('#modal-sub-images img');
            thumbs.forEach(img => {
                if (img.src === src) img.classList.add('active'); // Exact match
                else img.classList.remove('active');
            });
        }

        // Explicitly expose to window just in case
        window.openRoomDetail = openRoomDetail;

        // Event Delegation for Room List
        document.getElementById('room-list').addEventListener('click', function (e) {
            // debugLog('Click detected on room-list: ' + e.target.tagName);
            const card = e.target.closest('.room-card-grid');
            if (card) {
                const roomId = card.getAttribute('data-id');
                // debugLog('Card clicked! ID: ' + roomId);
                if (roomId) {
                    openRoomDetail(roomId);
                } else {
                    debugError('Card clicked but no data-id found');
                }
            }
        });

        // Close on outside click
        document.getElementById('room-modal').addEventListener('click', function (e) {
            if (e.target === this) closeModal();
        });

        // --- Payment Logic (Existing) ---

        // Toss Payments 초기화
        const clientKey = 'test_ck_Z61JOxRQVEBpvXZ7Glw2rW0X9bAq';
        const tossPayments = TossPayments(clientKey);

        async function bookRoom(roomId, roomName, price) {
            // 1. 로그인 체크
            const user = await getCurrentUser();
            if (!user) {
                if (confirm('예약을 하려면 로그인이 필요합니다.\n로그인 페이지로 이동하시겠습니까?')) {
                    window.location.href = 'login.html';
                }
                return;
            }

            // 2. 날짜 및 인원 가져오기
            const checkin = document.getElementById('checkin').value;
            const checkout = document.getElementById('checkout').value;
            const guests = document.getElementById('guests').value;

            // 유효성 검사
            if (!checkin || !checkout) {
                alert('체크인과 체크아웃 날짜를 선택해주세요.');
                return;
            }

            // 3. 결제 요청 (Toss Payments)
            const orderId = 'order_' + new Date().getTime(); // 고유 주문 번호
            const simpleOrderName = roomName; // 특수문자 제거 등 안전하게

            // URL 생성
            const origin = window.location.origin;
            const successUrl = new URL(origin + '/success.html');
            successUrl.searchParams.append('room_id', roomId);
            successUrl.searchParams.append('check_in', checkin);
            successUrl.searchParams.append('check_out', checkout);
            successUrl.searchParams.append('guests', guests);
            successUrl.searchParams.append('user_id', user.id);

            tossPayments.requestPayment('카드', {
                amount: price,
                orderId: orderId,
                orderName: simpleOrderName,
                customerName: user.user_metadata.full_name || '비회원',
                successUrl: successUrl.toString(),
                failUrl: origin + '/booking.html',
            }).catch(function (error) {
                if (error.code === 'USER_CANCEL') {
                    // 사용자 취소
                } else {
                    console.error(error);
                    alert('결제 초기화 실패: ' + error.message);
                }
            });
        }

        // 초기 로드: DOMContentLoaded 후 실행
        document.addEventListener('DOMContentLoaded', async () => {
            // debugLog('DOM loaded. Starting initialization...');
            try {
                await loadRooms();
            } catch (e) {

            }
        });
