<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 페이지 | 속초 베케이션 호텔</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <!-- Supabase SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="api/supabase.js"></script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            /* Use flex layout */
        }

        .admin-layout {
            display: flex;
            height: 100vh;
        }

        /* Sidebar */
        .admin-sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
        }

        .nav-item {
            display: block;
            width: 100%;
            padding: 1rem 1.5rem;
            text-align: left;
            background: none;
            border: none;
            color: #bdc3c7;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }

        .nav-item:hover,
        .nav-item.active {
            background-color: #34495e;
            color: white;
            border-left: 4px solid #3498db;
        }

        .sidebar-footer {
            padding: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Content */
        .admin-content {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
        }

        .tab-section {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Tables & Cards */
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .data-table th {
            background-color: #f8f9fa;
            font-weight: 600;
        }

        /* Buttons & Forms */
        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            width: 100%;
        }

        .text-right {
            text-align: right;
            margin-top: 1rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid #ddd;
            border-radius: 4px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
        }
    </style>
</head>

<body>

    <div class="admin-layout">
        <aside class="admin-sidebar">
            <div class="sidebar-header">
                <h3>호텔 관리자</h3>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" onclick="showTab('rooms')">객실 관리</button>
                <button class="nav-item" onclick="showTab('users')">회원 현황</button>
                <button class="nav-item" onclick="showTab('bookings')">예약 관리</button>
                <button class="nav-item" onclick="showTab('settings')">사이트 설정</button>
            </nav>
            <div class="sidebar-footer">
                <button class="btn btn-logout" onclick="handleLogout()">로그아웃</button>
            </div>
        </aside>

        <main class="admin-content">
            <!-- Rooms Section -->
            <section id="tab-rooms" class="tab-section active">
                <h2>객실 관리</h2>
                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>객실명</th>
                                <th>가격</th>
                                <th>인원</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="room-list-body">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Users Section -->
            <section id="tab-users" class="tab-section">
                <h2>회원 현황</h2>
                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>이름</th>
                                <th>이메일</th>
                                <th>등급</th>
                                <th>가입일</th>
                            </tr>
                        </thead>
                        <tbody id="user-list-body">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Bookings Section -->
            <section id="tab-bookings" class="tab-section">
                <h2>예약 관리</h2>
                <div class="card">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>예약번호</th>
                                <th>예약자</th>
                                <th>객실</th>
                                <th>날짜</th>
                                <th>상태</th>
                                <th>관리</th>
                            </tr>
                        </thead>
                        <tbody id="booking-list-body">
                            <!-- JS Generated -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Settings Section -->
            <section id="tab-settings" class="tab-section">
                <h2>사이트 설정</h2>
                <div class="card">
                    <h3>이벤트 배너 설정</h3>
                    <form id="banner-form" onsubmit="saveBannerSettings(event)">
                        <div class="form-group">
                            <label>
                                <input type="checkbox" id="banner-active">
                                배너 활성화 (메인 페이지 상단 노출)
                            </label>
                        </div>
                        <div class="form-group">
                            <label>배너 이미지 URL</label>
                            <input type="text" id="banner-url" placeholder="https://example.com/banner.jpg">
                        </div>
                        <button type="submit" class="btn btn-primary">설정 저장</button>
                    </form>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Room Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h3>객실 정보 수정</h3>
            <form id="edit-form">
                <input type="hidden" id="edit-id">
                <div class="form-group">
                    <label>객실명</label>
                    <input type="text" id="edit-name" disabled style="background:#f0f0f0;">
                </div>
                <div class="form-group">
                    <label>가격 (1박)</label>
                    <input type="number" id="edit-price">
                </div>
                <div class="form-group">
                    <label>설명</label>
                    <textarea id="edit-desc"></textarea>
                </div>
                <div class="text-right">
                    <button type="button" class="btn" onclick="closeModal('edit-modal')">취소</button>
                    <button type="submit" class="btn btn-primary">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Image Manage Modal -->
    <div id="image-modal" class="modal">
        <div class="modal-content">
            <h3>이미지 관리</h3>
            <p>이미지 URL을 한 줄에 하나씩 입력하세요. (첫 번째가 대표 이미지)</p>
            <form id="image-form" onsubmit="saveRoomImages(event)">
                <input type="hidden" id="img-room-id">
                <div class="form-group">
                    <textarea id="img-urls" style="height: 200px;"
                        placeholder="https://example.com/image1.jpg&#10;https://example.com/image2.jpg"></textarea>
                </div>
                <div class="text-right">
                    <button type="button" class="btn" onclick="closeModal('image-modal')">취소</button>
                    <button type="submit" class="btn btn-primary">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>

</html>
